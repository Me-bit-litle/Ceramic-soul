<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website for Ceramic soul brand" />
    <meta name="author" content="Awesome student" />
    <title>Catalog</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="catalog">
      <div class="container">
        <div class="header">
          <div class="header__menu">
            <div class="header__menu-close">
              <span></span>
              <span></span>
            </div>
            <nav class="header__menu-nav">
              <ul>
                <li>
                  <a
                    href="http://localhost:5173/catalog"
                    class="header__menu-link"
                    >catalog</a
                  >
                </li>
                <li><a href="#" class="header__menu-link">blog</a></li>
                <li><a href="#" class="header__menu-link">about</a></li>
              </ul>
            </nav>
          </div>
          <div class="header__top">
            <div class="burger"><span></span><span></span><span></span></div>
            <a href="#" class="header__logo">
              <img src="/src/logo/logo.png" alt="logo" />
            </a>
            <div class="header__icons">
              <a href=""><span class="icon-search"></span></a
              ><a href="#"><span class="icon-shopping-bag"></span></a>
            </div>
          </div>
          <nav class="header__nav">
            <ul>
              <li>
                <a href="http://localhost:5173/catalog" class="header__link"
                  >catalog</a
                >
              </li>
              <li><a href="#" class="header__link">blog</a></li>
              <li><a href="#" class="header__link">about</a></li>
            </ul>
          </nav>
        </div>

        <h1 class="title-h1 catalog__title">our pottery</h1>

        <div class="catalog__tabs">
          <button class="catalog__tab catalog__tab_active">for tea</button
          ><button class="catalog__tab">for kitchen</button
          ><button class="catalog__tab">for plants</button>
        </div>

        <div class="catalog__content">
          <div class="catalog__content-item">1</div>
          <div class="catalog__content-item">2</div>
          <div class="catalog__content-item">3</div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="container">
        <div class="pure-g footer__wrapper">
          <div class="pure-u-1 pure-u-xl-1-3 pure-u-xxl-1-3">
            <div class="footer__wrapper-newsletter">
              <h3 class="title-h3 footer__title">newsletter</h3>
              <p class="footer__text">
                Keep up to date with news and promotions
              </p>
              <form action="#">
                <fieldset class="footer__fieldset">
                  <div class="footer__input-block">
                    <input
                      class="footer__input"
                      type="email"
                      id="email"
                      name="email"
                      placeholder="Enter your e-mail"
                      required
                    />
                  </div>
                </fieldset>
                <label class="footer__label footer__check-block" for="checkbox">
                  <input
                    class="footer__check-box"
                    type="checkbox"
                    id="checkbox"
                    required
                  />
                  I agree with the <a href="#">terms</a>
                </label>
                <button class="btn-footer footer__btn">submit</button>
              </form>
            </div>
          </div>
          <div
            class="pure-u-md-4-5 pure-u-xl-1-3 pure-u-xxl-1-3 footer__wrapper-nav"
          >
            <div class="pure-u-1 footer__wrapper-title">
              <div class="footer__nav">
                <h3 class="title-h3 footer__title">discover</h3>
                <a class="footer__links" href="#">About Us</a>
                <a class="footer__links" href="#">Blog</a>
              </div>
              <div class="footer__nav">
                <h3 class="title-h3 footer__title">shopping</h3>
                <a class="footer__links" href="#">Catalog</a>
              </div>
            </div>
            <div class="pure-u-1 footer__information">
              <div class="footer__nav">
                <h3 class="title-h3 footer__title">information</h3>
                <a class="footer__links" href="#">Terms and Conditions</a>
              </div>
            </div>
          </div>
          <div class="pure-u-1 pure-u-md-1-5 pure-u-xl-1-3 pure-u-xxl-1-3">
            <div class="footer__wrapper-contacts">
              <h3 class="title-h3 footer__title">follow us</h3>
              <div class="footer__cta">
                <div class="footer__contacts">
                  <span class="icon-facebook"></span>
                </div>
                <div class="footer__contacts">
                  <span class="icon-instagram"></span>
                </div>
                <div class="footer__contacts">
                  <span class="icon-pinterest-circled"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <p class="footer__date">&copy;Copyright 2025, Ceramic soul</p>
      </div>
    </footer>

    <script type="module" src="/src/js/script.js"></script>
  </body>
</html>
